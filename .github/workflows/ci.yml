name: DC Express AI Agent CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        python -m py_compile app.py pricing_engine.py zalo_middleware.py zalo_oauth_manager.py chatwoot_service.py

    - name: Test Pricing Engine Calculations
      run: |
        python -c "
        from pricing_engine import estimate_pricing
        res = estimate_pricing('144 Xuân Thủy, Cầu Giấy, Hà Nội', 'Đông Mai, Quảng Ninh', 10.0, '1 thùng nước nuôi tôm')
        assert 'options' in res
        assert 'road_economy' in res['options']
        assert res['options']['road_economy']['customer_price_vnd'] > 0
        print('✅ Pricing Engine test passed successfully!')
        "

    - name: Test Zalo Middleware Endpoints (FastAPI) & OAuth / Chatwoot
      run: |
        python -c "
        from fastapi.testclient import TestClient
        from zalo_middleware import app
        client = TestClient(app)
        
        # 1. Health check
        res_h = client.get('/health')
        assert res_h.status_code == 200
        assert res_h.json()['status'] == 'healthy'
        
        # 2. Webhook verification
        res_w = client.get('/webhook')
        assert res_w.status_code == 200
        
        # 3. OAuth status
        res_o = client.get('/oauth/status')
        assert res_o.status_code == 200
        
        # 4. Chatwoot webhook
        res_cw = client.post('/chatwoot/webhook', json={'event': 'message_created', 'message_type': 'incoming'})
        assert res_cw.status_code == 200
        
        print('✅ All Zalo Middleware FastAPI, OAuth & Chatwoot tests passed successfully!')
        "


