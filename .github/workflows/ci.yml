name: DC Express AI Agent CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        python -m py_compile app.py pricing_engine.py zalo_middleware.py zalo_oauth_manager.py chatwoot_service.py dchub_service.py

    - name: Test Pricing Engine Calculations
      run: |
        python -c "
        from pricing_engine import estimate_pricing
        res = estimate_pricing('144 Xuân Thủy, Cầu Giấy, Hà Nội', 'Đông Mai, Quảng Ninh', 10.0, '1 thùng nước nuôi tôm')
        assert 'options' in res
        assert 'road_economy' in res['options']
        assert res['options']['road_economy']['customer_price_vnd'] > 0
        print('✅ Pricing Engine test passed successfully!')
        "

    - name: Test DC Hub Portal API Service (Phase 3)
      run: |
        python -c "
        from dchub_service import dchub_service
        
        # Test 1: Tạo Lead express_lead (Có nhu cầu)
        lead = dchub_service.create_lead(
            sender={'name': 'Long', 'phone': '0399092104', 'address': 'T1 Times City, Hà Nội'},
            receiver={'name': 'Thảo', 'phone': '0366427496', 'address': 'Thung Nham, Ninh Bình'},
            cargo={'description': '1 tập tài liệu', 'type': 'Phong bì, tài liệu', 'weight_kg': 1.0, 'cod_amount': 350000},
            service_type='Chuyển nhanh'
        )
        assert lead['success'] is True
        assert lead['status'] == 'Có nhu cầu'
        assert lead['type'] == 'express_lead'
        assert 'code' in lead and lead['code'].startswith('DC')
        
        # Test 2: Tạo Đơn hàng chính thức (Khách chốt)
        order = dchub_service.create_order(
            sender={'name': 'Long', 'phone': '0399092104', 'address': 'T1 Times City, Hà Nội'},
            receiver={'name': 'Thảo', 'phone': '0366427496', 'address': 'Thung Nham, Ninh Bình'},
            cargo={'description': '1 tập tài liệu', 'type': 'Phong bì, tài liệu', 'weight_kg': 1.0, 'cod_amount': 350000},
            pricing={'customer_price_vnd': 890000, 'base_cost_vnd': 390000, 'service_type': 'Chuyển nhanh'},
            payment_method='transfer | sender prepaid | company'
        )
        assert order['success'] is True
        assert order['status'] == 'Khách chốt'
        assert 'code' in order and order['code'].startswith('DC')
        
        # Test 3: Format Modal Clipboard chuẩn theo DC Hub Portal
        cb = order['clipboard_text']
        assert 'Mã đơn:' in cb
        assert 'Người gửi: Long' in cb
        assert 'ĐT: 0399092104' in cb
        assert 'Người nhận: Thảo' in cb
        assert 'ĐT: 0366427496' in cb
        assert 'Mô tả hàng: 1 tập tài liệu' in cb
        assert 'Loại hàng: Phong bì, tài liệu' in cb
        assert 'Đ/c lấy: T1 Times City, Hà Nội' in cb
        assert 'Đ/c trả: Thung Nham, Ninh Bình' in cb
        assert 'NET: 390,000 đ' in cb
        assert 'Thu hộ: 350,000 đ' in cb
        
        print('✅ DC Hub Portal API Service unit tests passed successfully!')
        "

    - name: Test Zalo Middleware Endpoints (FastAPI) & OAuth / Chatwoot / DC Hub
      run: |
        python -c "
        from fastapi.testclient import TestClient
        from zalo_middleware import app
        client = TestClient(app)
        
        # 1. Health check
        res_h = client.get('/health')
        assert res_h.status_code == 200
        assert res_h.json()['status'] == 'healthy'
        
        # 2. Webhook verification
        res_w = client.get('/webhook')
        assert res_w.status_code == 200
        
        # 3. OAuth status
        res_o = client.get('/oauth/status')
        assert res_o.status_code == 200
        
        # 4. Chatwoot webhook
        res_cw = client.post('/chatwoot/webhook', json={'event': 'message_created', 'message_type': 'incoming'})
        assert res_cw.status_code == 200
        
        # 5. Simulate Zalo Message flow & DC Hub Lead generation
        res_sim = client.post('/simulate/message', json={
            'user_id': 'test_zalo_user_phase3',
            'message': 'Tôi muốn gửi 1 tập tài liệu từ Times City Hà Nội đi Ninh Bình'
        })
        assert res_sim.status_code == 200
        data_sim = res_sim.json()
        assert data_sim['lead_code'] is not None
        assert data_sim['lead_code'].startswith('DC')
        
        print('✅ All Zalo Middleware, OAuth, Chatwoot & DC Hub tests passed successfully!')
        "


